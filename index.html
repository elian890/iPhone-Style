<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a90816">
  <title>iPhone Style | Catálogo Premium</title>
  <style>
    :root {
      --bg: #090405;
      --surface: #17090b;
      --surface-soft: #260b0f;
      --text: #f5f5f7;
      --muted: #c3a7aa;
      --accent: #d90d20;
      --accent-hover: #f12235;
      --border: #562027;
      --success: #28c840;
      --danger: #ff6961;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      background: radial-gradient(circle at 50% -20%, #4b0811 0, var(--bg) 34rem);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea { font: inherit; }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      min-height: 76px;
      padding: .5rem 5%;
      text-align: center;
      background: rgba(23, 9, 11, .88);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(14px);
    }

    .logo { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
    .brand-image { display: block; width: 58px; height: 58px; object-fit: contain; border-radius: 10px; }
    .brand-fallback { display: none; color: #fff; font-size: 1.15rem; font-weight: 800; letter-spacing: -.7px; }
    .brand-fallback span { display: block; font-weight: 400; }

    .hero { padding: 4rem 1rem 2rem; text-align: center; }

    .hero h1 { margin: 0 0 .5rem; font-size: clamp(2rem, 6vw, 3.1rem); letter-spacing: -1.5px; }
    .hero p { margin: 0; color: var(--muted); font-size: 1.08rem; }

    .container { width: min(1200px, 100%); margin: 0 auto; padding: 1.5rem 2rem 3rem; }

    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
      gap: 1.5rem;
    }

    .catalog-section-title {
      grid-column: 1 / -1;
      margin: 1.5rem 0 -.9rem;
      font-size: 1.45rem;
      letter-spacing: -.3px;
    }

    .catalog-section-title:first-child { margin-top: 0; }
    .catalog-section-subtitle { grid-column: 1 / -1; margin: 0 0 -.9rem; color: var(--muted); }
    .product-meta { min-height: 1.5rem; margin: -.15rem 0 1rem; color: var(--muted); font-size: .93rem; }

    .status {
      grid-column: 1 / -1;
      margin: 1rem 0;
      padding: 1.25rem;
      color: var(--muted);
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    .status-error { color: #ffd0cc; border-color: rgba(255, 105, 97, .55); }

    .card {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      transition: transform .2s ease, border-color .2s ease;
    }

    .card:hover { transform: translateY(-4px); border-color: #a52431; }

    .card-image {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 250px;
      padding: 1rem;
      background: var(--surface-soft);
    }

    .card-image img { width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; }

    .card-body { display: flex; flex: 1; flex-direction: column; padding: 1.35rem; }
    .card-title { margin: 0 0 .5rem; font-size: 1.35rem; line-height: 1.2; }
    .price-usd { margin-bottom: .2rem; color: #fff; font-size: 1.75rem; font-weight: 700; }
    .price-ars { min-height: 1.5rem; margin-bottom: 1.3rem; color: var(--muted); }

    .gift-box {
      display: flex;
      gap: .65rem;
      align-items: flex-start;
      margin: -.1rem 0 1.25rem;
      padding: .8rem .85rem;
      color: #ffe9eb;
      background: linear-gradient(135deg, rgba(217, 13, 32, .2), rgba(217, 13, 32, .06));
      border: 1px solid rgba(241, 34, 53, .45);
      border-radius: 11px;
      font-size: .88rem;
      line-height: 1.35;
    }

    .gift-box strong { color: #fff; }

    .installments {
      padding: 1rem;
      margin-bottom: 1.35rem;
      background: rgba(255, 255, 255, .03);
      border-radius: 12px;
    }

    .installments h4 {
      margin: 0 0 .7rem;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-align: center;
      text-transform: uppercase;
    }

    .installment {
      display: flex;
      justify-content: space-between;
      gap: .75rem;
      padding: .38rem 0;
      font-size: .94rem;
      border-bottom: 1px solid rgba(255, 255, 255, .06);
    }

    .installment:last-child { border-bottom: 0; padding-bottom: 0; }
    .installment strong { white-space: nowrap; }

    .actions { display: grid; gap: .75rem; margin-top: auto; }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: .75rem 1rem;
      border: 1px solid transparent;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 650;
      text-align: center;
      transition: background-color .2s ease, border-color .2s ease, transform .2s ease;
    }

    .button:hover { transform: translateY(-1px); }
    .button:focus-visible, .modal-close:focus-visible, .floating-whatsapp:focus-visible { outline: 3px solid rgba(241, 34, 53, .7); outline-offset: 3px; }
    .button-primary { color: #fff; background: var(--accent); }
    .button-primary:hover { background: var(--accent-hover); }
    .button-secondary { color: var(--accent); background: transparent; border-color: var(--accent); }
    .button-secondary:hover { background: rgba(217, 13, 32, .12); }
    .button-whatsapp { gap: .55rem; color: #fff; background: var(--success); }
    .button-whatsapp:hover { background: #20a033; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 1rem;
      visibility: hidden;
      opacity: 0;
      background: rgba(0, 0, 0, .82);
      backdrop-filter: blur(5px);
      transition: opacity .2s ease, visibility .2s ease;
    }

    .modal-overlay.active { visibility: visible; opacity: 1; }

    .modal {
      position: relative;
      width: min(500px, 100%);
      max-height: calc(100vh - 2rem);
      padding: 2rem;
      overflow: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      transform: translateY(18px);
      transition: transform .2s ease;
    }

    .modal-overlay.active .modal { transform: translateY(0); }
    .modal h2 { margin: 0 2rem .35rem 0; font-size: 1.5rem; }
    .modal-subtitle { margin: 0 0 1.4rem; color: var(--muted); }
    .modal-close {
      position: absolute;
      top: 1.1rem;
      right: 1.1rem;
      width: 38px;
      height: 38px;
      padding: 0;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.8rem;
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); background: rgba(255,255,255,.08); }

    .form-group { margin-bottom: 1.05rem; }
    .form-group label { display: block; margin-bottom: .45rem; color: var(--muted); font-size: .92rem; }
    .form-control {
      width: 100%;
      min-height: 45px;
      padding: .7rem .85rem;
      color: #fff;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }
    .form-control:focus { border-color: var(--accent); }
    .form-control:invalid:not(:placeholder-shown) { border-color: var(--danger); }
    textarea.form-control { min-height: 82px; resize: vertical; }

    .floating-whatsapp {
      position: fixed;
      right: 1.25rem;
      bottom: 1.25rem;
      z-index: 15;
      display: grid;
      width: 60px;
      height: 60px;
      place-items: center;
      color: #fff;
      background: #25d366;
      border: 3px solid rgba(255, 255, 255, .92);
      border-radius: 50%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
      transition: transform .2s ease, background-color .2s ease;
    }

    .floating-whatsapp:hover { background: #1ebe5a; transform: scale(1.08); }
    .floating-whatsapp svg { width: 30px; height: 30px; }

    .loading-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: radial-gradient(circle at 50% 15%, #e0182c, #9a0714 47%, #520409 100%);
      transition: opacity .35s ease, visibility .35s ease;
    }

    .loading-screen.is-hidden { visibility: hidden; opacity: 0; pointer-events: none; }
    .loading-brand { display: grid; justify-items: center; gap: 1rem; color: white; text-align: center; }
    .loading-brand .brand-image { width: min(220px, 55vw); height: min(220px, 55vw); border-radius: 20px; box-shadow: 0 16px 40px rgba(45,0,5,.35); }
    .loading-brand .brand-fallback { font-size: clamp(2.2rem, 10vw, 4rem); line-height: .9; }
    .loading-brand p { margin: 0; font-weight: 600; letter-spacing: .4px; }

    @media (max-width: 600px) {
      .hero { padding-top: 2.8rem; }
      .container { padding: 1rem 1rem 2.5rem; }
      .modal { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <div id="loadingScreen" class="loading-screen" role="status" aria-live="polite" aria-label="Cargando iPhone Style">
    <div class="loading-brand">
      <img class="brand-image" src="img/logo-iph-style.png" alt="iPhone Style" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="brand-fallback">IPHONE <span>STYLE </span></div>
      <p>Cargando catálogo…</p>
    </div>
  </div>

  <header>
    <a class="logo" href="#inicio" aria-label="iPhone Style, ir al inicio">
      <img class="brand-image" src="img/logo-iph-style.png" alt="iPhone Style" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <span class="brand-fallback">IPHONE <span>STYLE </span></span>
    </a>
  </header>

  <main id="inicio">
    <section class="hero" aria-labelledby="main-title">
      <h1 id="main-title">Actualizá tu equipo hoy</h1>
      <p>Precios exclusivos. Cuotas fijas. Plan Canje disponible.</p>
    </section>

    <section class="container" aria-label="Catálogo de equipos disponibles">
      <div id="catalog" class="catalog-grid" aria-live="polite">
        <p class="status">Cargando catálogo premium…</p>
      </div>
    </section>
  </main>

  <div id="canjeModal" class="modal-overlay" aria-hidden="true">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="canjeTitle" aria-describedby="canjeDescription">
      <button id="closeModalButton" class="modal-close" type="button" aria-label="Cerrar Plan Canje">×</button>
      <h2 id="canjeTitle">Plan Canje</h2>
      <p id="canjeDescription" class="modal-subtitle">Estás interesado en un <strong id="targetModelText">equipo</strong>. Contanos sobre tu equipo actual para cotizar la diferencia.</p>

      <form id="canjeForm" novalidate>
        <div class="form-group">
          <label for="canjeModel">Modelo a entregar</label>
          <input id="canjeModel" class="form-control" type="text" placeholder="Ej.: iPhone 13 Pro" autocomplete="off" required>
        </div>
        <div class="form-group">
          <label for="canjeGB">Capacidad</label>
          <select id="canjeGB" class="form-control" required>
            <option value="64 GB">64 GB</option>
            <option value="128 GB" selected>128 GB</option>
            <option value="256 GB">256 GB</option>
            <option value="512 GB">512 GB</option>
            <option value="1 TB">1 TB</option>
          </select>
        </div>
        <div class="form-group">
          <label for="canjeBattery">Condición de batería (%)</label>
          <input id="canjeBattery" class="form-control" type="number" inputmode="numeric" placeholder="Ej.: 85" min="1" max="100" required>
        </div>
        <div class="form-group">
          <label for="canjeCondition">Estado general</label>
          <select id="canjeCondition" class="form-control" required>
            <option value="Impecable (sin marcas)">Impecable (sin marcas)</option>
            <option value="Marcas normales de uso">Marcas normales de uso</option>
            <option value="Detalles estéticos marcados">Detalles estéticos marcados</option>
            <option value="Vidrio o tapa rota">Vidrio o tapa rota</option>
          </select>
        </div>
        <div class="form-group">
          <label for="canjeDetails">Piezas cambiadas o detalles extra <small>(opcional)</small></label>
          <textarea id="canjeDetails" class="form-control" placeholder="Ej.: Batería cambiada, True Tone no funciona. Si está todo original, dejalo vacío."></textarea>
        </div>
        <button class="button button-whatsapp" type="submit" aria-label="Enviar cotización por WhatsApp">
          <span aria-hidden="true">◉</span> Cotizar diferencia por WhatsApp
        </button>
      </form>
    </section>
  </div>

  <a class="floating-whatsapp" href="https://wa.me/5493476658161?text=Hola%20iPhone%20Style%21%20Quiero%20hacer%20una%20consulta." target="_blank" rel="noopener noreferrer" aria-label="Escribir a iPhone Style por WhatsApp">
    <svg aria-hidden="true" viewBox="0 0 32 32" fill="currentColor"><path d="M19.11 17.2c-.28-.14-1.66-.82-1.92-.91-.26-.1-.45-.14-.64.14-.19.28-.73.91-.9 1.1-.16.19-.33.21-.61.07-.28-.14-1.18-.44-2.25-1.39-.83-.74-1.39-1.66-1.55-1.94-.16-.28-.02-.43.12-.57.12-.12.28-.33.42-.49.14-.16.19-.28.28-.47.09-.19.05-.35-.02-.49-.07-.14-.64-1.55-.87-2.12-.23-.55-.47-.48-.64-.49h-.55c-.19 0-.49.07-.75.35-.26.28-.99.97-.99 2.37s1.01 2.76 1.15 2.95c.14.19 1.98 3.02 4.79 4.24.67.29 1.19.46 1.6.59.67.21 1.28.18 1.76.11.54-.08 1.66-.68 1.9-1.34.23-.66.23-1.23.16-1.34-.07-.12-.26-.19-.54-.33Z"/><path d="M16.03 3.2a12.79 12.79 0 0 0-10.86 19.56L3.3 28.8l6.2-1.82A12.8 12.8 0 1 0 16.03 3.2Zm0 23.25c-2.05 0-4.06-.55-5.82-1.6l-.42-.25-3.68 1.08 1.1-3.59-.27-.44a10.44 10.44 0 1 1 9.09 4.8Z"/></svg>
  </a>

  <!-- Papa Parse maneja campos entre comillas, comas y saltos de línea dentro de las celdas. -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.5.3/papaparse.min.js"></script>
  <script>
    'use strict';

    // Fuente de datos de Google Sheets. La hoja debe estar publicada o tener acceso público de lectura.
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/1A76HzLtPNQZq3cG-XgsqSTBLYRH7BusSB4MD2wA52OA/export?format=csv&gid=0';
    const WHATSAPP_NUMBER = '5493476658161';
    const INSTALLMENTS = [3, 6, 9, 12, 18];
    // Fotos locales de respaldo. Si la hoja incluye una columna IMAGEN, esa URL tiene prioridad.
    // Los archivos viven en la raíz del repositorio porque GitHub los publica así al cargarlos desde su formulario web.
    const PRODUCT_IMAGE_FILES = {
      'IPHONE 13|BLUE': 'iphone-13-blue.jpg',
      'IPHONE 13|RED': 'iphone-13-red.jpg',
      'IPHONE 13 PRO MAX|SIERRA BLUE': 'iphone-13-pro-max-sierra-blue.jpg',
      'IPHONE 13 PRO MAX|ALPINE GREEN': 'iphone-13-pro-max-alpine-green.jpg',
      'IPHONE 15|BLUE': 'iphone-15-blue.png',
      'IPHONE 15|BLACK': 'iphone-15-black.jpg',
      'IPHONE 15 PRO|BLACK': 'iphone-15-pro-black.jpg',
      'IPHONE 15 PRO|WHITE': 'iphone-15-pro-white.jpg',
      'IPHONE 15 PRO MAX|BLACK': 'iphone-15-pro-max-black.jpg',
      'IPHONE 16|BLACK': 'iphone-16-black.png',
      'IPHONE 16|PINK': 'iphone-16-pink.jpg',
      'IPHONE 16 PRO|WHITE': 'iphone-16-pro-white.jpg',
      'IPHONE 16 PRO|NATURAL': 'iphone-16-pro-natural.png',
      'IPHONE 16 PRO MAX|BLACK': 'iphone-16-pro-max-black.jpg'
    };
    const MODEL_IMAGE_FILES = {
      'IPHONE 13': 'iphone-13.jpg',
      'IPHONE 13 PRO MAX': 'iphone-13-pro-max.jpg',
      'IPHONE 15': 'iphone-15.jpg',
      'IPHONE 15 PRO': 'iphone-15-pro.jpg',
      'IPHONE 15 PRO MAX': 'iphone-15-pro-max.jpg',
      'IPHONE 16': 'iphone-16.jpg',
      'IPHONE 16 PRO': 'iphone-16-pro.jpg',
      'IPHONE 16 PRO MAX': 'iphone-16-pro-max.jpg'
    };
    const PLACEHOLDER_IMAGE = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='400' viewBox='0 0 400 400'%3E%3Crect width='400' height='400' fill='%231c1c1e'/%3E%3Cpath d='M160 80h80c15 0 28 13 28 28v184c0 15-13 28-28 28h-80c-15 0-28-13-28-28V108c0-15 13-28 28-28Z' fill='none' stroke='%2386868b' stroke-width='9'/%3E%3Ccircle cx='200' cy='286' r='7' fill='%2386868b'/%3E%3Ctext x='200' y='355' fill='%2386868b' font-family='Arial, sans-serif' font-size='20' text-anchor='middle'%3EFoto del equipo%3C/text%3E%3C/svg%3E";

    let config = { dolar: 0, recargos: {}, whatsapp: WHATSAPP_NUMBER };
    let selectedProductForCanje = '';
    let lastFocusedElement = null;

    const catalog = document.getElementById('catalog');
    const canjeModal = document.getElementById('canjeModal');
    const canjeForm = document.getElementById('canjeForm');
    const targetModelText = document.getElementById('targetModelText');
    const canjeModel = document.getElementById('canjeModel');
    const loadingScreen = document.getElementById('loadingScreen');

    const formatARS = (value) => new Intl.NumberFormat('es-AR', {
      style: 'currency', currency: 'ARS', maximumFractionDigits: 0
    }).format(value);

    const formatUSD = (value) => new Intl.NumberFormat('en-US', {
      style: 'currency', currency: 'USD', maximumFractionDigits: 0
    }).format(value);

    function normalizeCell(value) {
      return String(value ?? '').replace(/^\uFEFF/, '').trim();
    }

    // Acepta valores de Sheets como 1350, 1.350, 1.350,50 o 1,350.50.
    function toNumber(value) {
      const raw = normalizeCell(value).replace(/\s/g, '').replace(/[^\d,.-]/g, '');
      if (!raw) return Number.NaN;

      const comma = raw.lastIndexOf(',');
      const dot = raw.lastIndexOf('.');
      let normalized = raw;

      if (comma !== -1 && dot !== -1) {
        normalized = comma > dot
          ? raw.replace(/\./g, '').replace(',', '.')
          : raw.replace(/,/g, '');
      } else if (comma !== -1) {
        const decimals = raw.length - comma - 1;
        const commas = (raw.match(/,/g) || []).length;
        normalized = decimals === 3 || commas > 1 ? raw.replace(/,/g, '') : raw.replace(',', '.');
      } else if (dot !== -1) {
        const decimals = raw.length - dot - 1;
        const dots = (raw.match(/\./g) || []).length;
        normalized = decimals === 3 || dots > 1 ? raw.replace(/\./g, '') : raw;
      }
      return Number(normalized);
    }

    function setStatus(message, isError = false) {
      catalog.replaceChildren();
      const status = document.createElement('p');
      status.className = `status${isError ? ' status-error' : ''}`;
      status.textContent = message;
      catalog.append(status);
    }

    function hideLoadingScreen() {
      window.setTimeout(() => loadingScreen.classList.add('is-hidden'), 250);
    }

    function normalizeHeader(value) {
      return normalizeCell(value)
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toUpperCase();
    }

    function rowIsEmpty(row) {
      return !row.some((cell) => normalizeCell(cell));
    }

    function findDollarRate(rows) {
      for (const row of rows) {
        for (let index = 0; index < row.length; index += 1) {
          if (normalizeHeader(row[index]).includes('COTIZACION DOLAR')) {
            const value = toNumber(row[index + 1]);
            if (Number.isFinite(value) && value > 0) return value;
          }
        }
      }
      return 0;
    }

    function findSectionInfo(rows, headerIndex) {
      let title = 'Equipos disponibles';
      let warranty = '';
      for (let index = headerIndex - 1; index >= 0 && index >= headerIndex - 5; index -= 1) {
        const text = rowToText(rows[index]);
        const header = normalizeHeader(text);
        if (!warranty && (header.includes('GARANTIA') || header.includes('DIAS'))) warranty = text;
        if (header.includes('IPHONES')) {
          title = text.replace(//g, '').trim();
          break;
        }
      }
      return { title, warranty };
    }

    function rowToText(row) {
      return row.map(normalizeCell).filter(Boolean).join(' ');
    }

    function findColumn(headers, text) {
      return headers.findIndex((header) => header.includes(text));
    }

    function findInstallmentColumn(headers, term) {
      return headers.findIndex((header) => header.includes(`${term} CUOTAS`));
    }

    function formatCapacity(value) {
      const capacity = normalizeCell(value);
      return /(?:GB|TB)$/i.test(capacity) ? capacity : `${capacity} GB`;
    }

    // Lee el formato real de la hoja: secciones, encabezados y valores ya calculados.
    // También respeta Stock si en el futuro se agrega una columna con ese nombre.
    function getAvailableProducts(rows) {
      const products = [];
      const dollarRate = findDollarRate(rows);
      config = { dolar: dollarRate, recargos: {}, whatsapp: WHATSAPP_NUMBER };

      for (let headerRow = 0; headerRow < rows.length; headerRow += 1) {
        const headers = rows[headerRow].map(normalizeHeader);
        const modelIndex = findColumn(headers, 'MODELO');
        const usdIndex = headers.findIndex((header) => header === 'USD' || header.startsWith('USD '));
        if (modelIndex === -1 || usdIndex === -1) continue;

        const capacityIndex = findColumn(headers, 'GB');
        const colorIndex = findColumn(headers, 'COLOR');
        const batteryIndex = findColumn(headers, 'BATERIA');
        const detailsIndex = findColumn(headers, 'DETALLES');
        const cashIndex = findColumn(headers, 'PESOS');
        const transferIndex = findColumn(headers, 'TRANSFERENCIA');
        const stockIndex = findColumn(headers, 'STOCK');
        const imageIndex = findColumn(headers, 'IMAGEN');
        const section = findSectionInfo(rows, headerRow);

        for (let rowIndex = headerRow + 1; rowIndex < rows.length; rowIndex += 1) {
          const row = rows[rowIndex];
          if (rowIsEmpty(row)) break;
          const possibleHeaders = row.map(normalizeHeader);
          if (findColumn(possibleHeaders, 'MODELO') !== -1 && findColumn(possibleHeaders, 'USD') !== -1) break;

          const modelo = normalizeCell(row[modelIndex]);
          const precioUSD = toNumber(row[usdIndex]);
          const stock = stockIndex === -1 ? null : toNumber(row[stockIndex]);
          if (!modelo || !Number.isFinite(precioUSD) || precioUSD <= 0 || (stock !== null && stock <= 0)) continue;

          const installments = {};
          INSTALLMENTS.forEach((term) => {
            const column = findInstallmentColumn(headers, term);
            const value = column === -1 ? Number.NaN : toNumber(row[column]);
            if (Number.isFinite(value) && value > 0) installments[term] = value;
          });

          products.push({
            section: section.title,
            warranty: section.warranty,
            modelo,
            capacidad: capacityIndex === -1 ? '' : formatCapacity(row[capacityIndex]),
            color: colorIndex === -1 ? '' : normalizeCell(row[colorIndex]),
            bateria: batteryIndex === -1 ? '' : normalizeCell(row[batteryIndex]),
            detalles: detailsIndex === -1 ? '' : normalizeCell(row[detailsIndex]),
            precioUSD,
            precioEfectivo: cashIndex === -1 ? Number.NaN : toNumber(row[cashIndex]),
            precioTransferencia: transferIndex === -1 ? Number.NaN : toNumber(row[transferIndex]),
            installments,
            imagen: (imageIndex === -1 ? '' : normalizeCell(row[imageIndex])) ||
              PRODUCT_IMAGE_FILES[`${normalizeHeader(modelo)}|${normalizeHeader(colorIndex === -1 ? '' : row[colorIndex])}`] ||
              MODEL_IMAGE_FILES[normalizeHeader(modelo)] || ''
          });
        }
      }
      return products;
    }

    function appendTextElement(parent, tagName, className, text) {
      const element = document.createElement(tagName);
      if (className) element.className = className;
      element.textContent = text;
      parent.append(element);
      return element;
    }

    function createProductCard(product) {
      const fullName = [product.modelo, product.capacidad].filter(Boolean).join(' · ');
      const priceCash = Number.isFinite(product.precioEfectivo)
        ? product.precioEfectivo
        : product.precioUSD * config.dolar;
      const card = document.createElement('article');
      card.className = 'card';

      const imageContainer = document.createElement('div');
      imageContainer.className = 'card-image';
      const image = document.createElement('img');
      image.src = product.imagen || PLACEHOLDER_IMAGE;
      image.alt = fullName;
      image.loading = 'lazy';
      image.addEventListener('error', () => {
        if (image.src !== PLACEHOLDER_IMAGE) image.src = PLACEHOLDER_IMAGE;
      }, { once: true });
      imageContainer.append(image);

      const body = document.createElement('div');
      body.className = 'card-body';
      appendTextElement(body, 'h2', 'card-title', fullName);
      const productMeta = [product.color && `Color: ${product.color}`, product.bateria && `Batería: ${product.bateria}`, product.detalles && `Detalle: ${product.detalles}`]
        .filter(Boolean).join(' · ');
      if (productMeta) appendTextElement(body, 'p', 'product-meta', productMeta);
      appendTextElement(body, 'div', 'price-usd', `Precio en USD: ${formatUSD(product.precioUSD)}`);
      const prices = [`Efectivo: ${formatARS(priceCash)}`];
      if (Number.isFinite(product.precioTransferencia)) prices.push(`Transferencia: ${formatARS(product.precioTransferencia)}`);
      appendTextElement(body, 'div', 'price-ars', prices.join(' · '));

      const gift = document.createElement('div');
      gift.className = 'gift-box';
      gift.innerHTML = '<span aria-hidden="true">🎁</span><span><strong>Con tu compra te regalamos:</strong><br>Cargador de carga rápida + cable + funda + vidrio templado + garantía.</span>';
      body.append(gift);

      const installmentsBox = document.createElement('section');
      installmentsBox.className = 'installments';
      appendTextElement(installmentsBox, 'h4', '', 'Cuotas fijas en pesos');
      INSTALLMENTS.forEach((term) => {
        const installmentValue = product.installments[term] || (priceCash * (1 + (config.recargos[term] || 0) / 100) / term);
        const row = document.createElement('div');
        row.className = 'installment';
        appendTextElement(row, 'span', '', `${term} cuotas de`);
        appendTextElement(row, 'strong', '', formatARS(installmentValue));
        installmentsBox.append(row);
      });
      body.append(installmentsBox);

      const actions = document.createElement('div');
      actions.className = 'actions';
      const buyButton = document.createElement('button');
      buyButton.className = 'button button-primary';
      buyButton.type = 'button';
      buyButton.textContent = 'Comprar';
      buyButton.addEventListener('click', () => buyDirect(fullName, product.precioUSD, priceCash));

      const tradeInButton = document.createElement('button');
      tradeInButton.className = 'button button-secondary';
      tradeInButton.type = 'button';
      tradeInButton.textContent = 'Plan Canje';
      tradeInButton.addEventListener('click', () => openCanjeModal(fullName));
      actions.append(buyButton, tradeInButton);
      body.append(actions);
      card.append(imageContainer, body);
      return card;
    }

    function renderProducts(products) {
      catalog.replaceChildren();
      if (!products.length) {
        setStatus('Por el momento no hay equipos disponibles.');
        return;
      }
      let currentSection = '';
      products.forEach((product) => {
        if (product.section !== currentSection) {
          currentSection = product.section;
          appendTextElement(catalog, 'h2', 'catalog-section-title', product.section);
          if (product.warranty) appendTextElement(catalog, 'p', 'catalog-section-subtitle', product.warranty);
        }
        catalog.append(createProductCard(product));
      });
    }

    async function loadCatalog() {
      if (typeof Papa === 'undefined') {
        setStatus('No se pudo cargar el lector de datos. Actualizá la página e intentá nuevamente.', true);
        hideLoadingScreen();
        return;
      }

      try {
        // Descargar primero permite identificar permisos o respuestas HTTP inválidas.
        const response = await fetch(CSV_URL, { cache: 'no-store' });
        if (!response.ok) {
          throw new Error(`Google Sheets respondió con estado ${response.status}. Publicá la hoja para que cualquier persona con el enlace pueda verla.`);
        }

        const csvText = await response.text();
        const results = Papa.parse(csvText, {
          header: false,
          skipEmptyLines: 'greedy'
        });

        if (results.errors.length) {
          console.warn('Advertencias al interpretar el CSV:', results.errors);
        }
        if (!Array.isArray(results.data) || results.data.length < 1) {
          throw new Error('La hoja no contiene datos.');
        }

        renderProducts(getAvailableProducts(results.data));
      } catch (error) {
        console.error('Error al cargar el catálogo:', error);
        const detail = error instanceof Error ? error.message : 'Error desconocido.';
        setStatus(`No se pudo cargar el catálogo: ${detail}`, true);
      } finally {
        hideLoadingScreen();
      }
    }

    function openWhatsApp(message) {
      const url = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    function buyDirect(product, priceUSD, priceARS) {
      const message = [
        'Hola iPhone Style!',
        `Me interesa comprar el *${product}*.`,
        `Lo vi en la web a ${formatUSD(priceUSD)} (contado ${formatARS(priceARS)}).`,
        '¿Podemos coordinar para acercarme a la sucursal?'
      ].join('\n');
      openWhatsApp(message);
    }

    function openCanjeModal(targetProduct) {
      lastFocusedElement = document.activeElement;
      selectedProductForCanje = targetProduct;
      targetModelText.textContent = targetProduct;
      canjeModal.classList.add('active');
      canjeModal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      window.setTimeout(() => canjeModel.focus(), 50);
    }

    function closeModal() {
      canjeModal.classList.remove('active');
      canjeModal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      if (lastFocusedElement instanceof HTMLElement) lastFocusedElement.focus();
    }

    document.getElementById('closeModalButton').addEventListener('click', closeModal);
    canjeModal.addEventListener('click', (event) => {
      if (event.target === canjeModal) closeModal();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && canjeModal.classList.contains('active')) closeModal();
    });

    canjeForm.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!canjeForm.reportValidity() || !selectedProductForCanje) return;

      const model = normalizeCell(document.getElementById('canjeModel').value);
      const capacity = document.getElementById('canjeGB').value;
      const battery = document.getElementById('canjeBattery').value;
      const condition = document.getElementById('canjeCondition').value;
      const details = normalizeCell(document.getElementById('canjeDetails').value) || 'Sin detalles adicionales informados';

      const message = [
        'Hola iPhone Style!',
        `Me interesa el *${selectedProductForCanje}*.`,
        '',
        '*PLAN CANJE — equipo a entregar*',
        `📱 *Modelo:* ${model}`,
        `💾 *Capacidad:* ${capacity}`,
        `🔋 *Batería:* ${battery}%`,
        `✨ *Estado:* ${condition}`,
        `📝 *Detalles:* ${details}`,
        '',
        '¿Me pasarían la diferencia a abonar?'
      ].join('\n');

      openWhatsApp(message);
      closeModal();
      canjeForm.reset();
    });

    loadCatalog();
  </script>
</body>
</html>
